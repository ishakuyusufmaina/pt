<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Institution Form</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .form-container {
      background-color: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.7);
      width: 90%;
      max-width: 400px;
    }

    .form-container h2 {
      margin-bottom: 1rem;
      text-align: center;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      background-color: #2c2c2c;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      margin: 1rem 0;
    }

    .checkbox-container input {
      margin-right: 0.5rem;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #3f51b5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #5c6bc0;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Welcome 😊</h2>
    <p id="name"></p>
    <form>
      <select required>
        <option value="">- Institution -</option>
        <option value="UNIMAID">UNIMAID</option>
        <option value="BOSU">BOSU</option>
        <option value="AL-Ansar">AL-Ansar</option>
        <option value="Ramat">Ramat Polytech</option>
      </select>

     <select id="states" name="states" required>
        <option value="">- Select State -</option>
        <option value="abia">Abia</option>
        <option value="adamawa">Adamawa</option>
        <option value="akwa_ibom">Akwa Ibom</option>
        <option value="anambra">Anambra</option>
        <option value="bauchi">Bauchi</option>
        <option value="bayelsa">Bayelsa</option>
        <option value="benue">Benue</option>
        <option value="borno">Borno</option>
        <option value="cross_river">Cross River</option>
        <option value="delta">Delta</option>
        <option value="ebonyi">Ebonyi</option>
        <option value="edo">Edo</option>
        <option value="ekiti">Ekiti</option>
        <option value="enugu">Enugu</option>
        <option value="fct">Federal Capital Territory (FCT)</option>
        <option value="gombe">Gombe</option>
        <option value="imo">Imo</option>
        <option value="jigawa">Jigawa</option>
        <option value="kaduna">Kaduna</option>
        <option value="kano">Kano</option>
        <option value="katsina">Katsina</option>
        <option value="kebbi">Kebbi</option>
        <option value="kogi">Kogi</option>
        <option value="kwara">Kwara</option>
        <option value="lagos">Lagos</option>
        <option value="nasarawa">Nasarawa</option>
        <option value="niger">Niger</option>
        <option value="ogun">Ogun</option>
        <option value="ondo">Ondo</option>
        <option value="osun">Osun</option>
        <option value="oyo">Oyo</option>
        <option value="plateau">Plateau</option>
        <option value="rivers">Rivers</option>
        <option value="sokoto">Sokoto</option>
        <option value="taraba">Taraba</option>
        <option value="yobe">Yobe</option>
        <option value="zamfara">Zamfara</option>
      </select>


      <input type="text" placeholder="Department" required />

      <select required>
        <option value="">- Level -</option>
        <option value="100">100 Level</option>
        <option value="200">200 Level</option>
        <option value="300">300 Level</option>
        <option value="400">400 Level</option>
        <option value="500">500 Level</option>
      </select>

      <div class="checkbox-container">
        <label for="canAfford">Can you afford a domain name (&#8358;5k)?</label>
        <input type="radio" id="yes" name="canAfford"> 
        <label for="yes">Yes</label> <br>
        <input type="radio" id="no" name="canAfford"> 
        <label for="no">Yes</label>
       
      </div>

      <button type="submit">Proceed</button>
    </form>
  </div>
</body>
</html>
